<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Segoe UI', system-ui, monospace">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafaf9"/><stop offset="1" stop-color="#f5f5f4"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" rx="20" fill="url(#tbg)"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#1c1917" font-family="'Segoe UI', system-ui, sans-serif">🗄️ Data Model</text>
  <text x="40" y="78" font-size="14" fill="#78716c" font-family="'Segoe UI', system-ui, sans-serif">Prisma schema — 25 models, connectors pulse with live data</text>

  <!-- marching connectors -->
  <g stroke="#ea580c" stroke-width="2.5" fill="none" stroke-dasharray="10 8">
    <path d="M240 170 C 320 170 320 250 400 250"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M560 170 C 640 170 640 250 700 250"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M480 330 L480 400"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M180 410 C 180 470 240 490 300 490"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M780 410 C 780 470 720 490 660 490"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M720 170 L720 120 L480 120 L480 170" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- table boxes -->
  <g font-size="12">
    <g>
      <rect x="100" y="110" width="140" height="60" rx="10" fill="#7c2d12"/>
      <text x="170" y="135" text-anchor="middle" fill="#fff7ed" font-weight="700" font-size="14">Branch</text>
      <text x="170" y="155" text-anchor="middle" fill="#fdba74">id • name • nameMy</text>
    </g>
    <g>
      <rect x="400" y="250" width="160" height="80" rx="10" fill="#fff" stroke="#ea580c" stroke-width="3"/>
      <text x="480" y="278" text-anchor="middle" fill="#1c1917" font-weight="800" font-size="15">Order ⭐</text>
      <text x="480" y="298" text-anchor="middle" fill="#78716c">id • status • total</text>
      <text x="480" y="314" text-anchor="middle" fill="#78716c">tableId • cashierId</text>
    </g>
    <g>
      <rect x="700" y="250" width="160" height="80" rx="10" fill="#fff" stroke="#a8a29e" stroke-width="2"/>
      <text x="780" y="278" text-anchor="middle" fill="#1c1917" font-weight="700" font-size="14">OrderItem</text>
      <text x="780" y="298" text-anchor="middle" fill="#78716c">qty • price • mods</text>
      <text x="780" y="314" text-anchor="middle" fill="#78716c">→ MenuItem</text>
    </g>
    <g>
      <rect x="400" y="400" width="160" height="60" rx="10" fill="#fff" stroke="#a8a29e" stroke-width="2"/>
      <text x="480" y="425" text-anchor="middle" fill="#1c1917" font-weight="700" font-size="14">Payment</text>
      <text x="480" y="445" text-anchor="middle" fill="#78716c">method • amount</text>
    </g>
    <g>
      <rect x="40" y="380" width="140" height="60" rx="10" fill="#fff" stroke="#a8a29e" stroke-width="2"/>
      <text x="110" y="405" text-anchor="middle" fill="#1c1917" font-weight="700" font-size="14">CafeTable</text>
      <text x="110" y="425" text-anchor="middle" fill="#78716c">number • seats</text>
    </g>
    <g>
      <rect x="780" y="380" width="140" height="60" rx="10" fill="#fff" stroke="#a8a29e" stroke-width="2"/>
      <text x="850" y="405" text-anchor="middle" fill="#1c1917" font-weight="700" font-size="14">Customer</text>
      <text x="850" y="425" text-anchor="middle" fill="#78716c">phone • points</text>
    </g>
    <g>
      <rect x="300" y="470" width="160" height="60" rx="10" fill="#fff" stroke="#a8a29e" stroke-width="2"/>
      <text x="380" y="495" text-anchor="middle" fill="#1c1917" font-weight="700" font-size="14">MenuItem</text>
      <text x="380" y="515" text-anchor="middle" fill="#78716c">name • nameMy • price</text>
    </g>
    <g>
      <rect x="500" y="470" width="160" height="60" rx="10" fill="#fff" stroke="#a8a29e" stroke-width="2"/>
      <text x="580" y="495" text-anchor="middle" fill="#1c1917" font-weight="700" font-size="14">Ingredient</text>
      <text x="580" y="515" text-anchor="middle" fill="#78716c">stock • unit • lowAt</text>
    </g>
    <g>
      <rect x="640" y="90" width="160" height="60" rx="10" fill="#fff" stroke="#a8a29e" stroke-width="2"/>
      <text x="720" y="115" text-anchor="middle" fill="#1c1917" font-weight="700" font-size="14">User / Staff</text>
      <text x="720" y="135" text-anchor="middle" fill="#78716c">role • pin • branch</text>
    </g>
  </g>

  <!-- pulsing data packets on connectors -->
  <g fill="#ea580c">
    <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite" path="M240 170 C 320 170 320 250 400 250"/></circle>
    <circle r="6"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M560 170 C 640 170 640 250 700 250"/></circle>
    <circle r="6"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M480 330 L480 400"/></circle>
  </g>

  <text x="480" y="575" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="'Segoe UI', system-ui, sans-serif">+ Session • Account • Category • Modifier • Recipe • StockMovement • PurchaseOrder • Shift • Attendance • Roster • DailyClose • AuditLog • Notification • Reservation • Refund • Tip • Setting • Verification</text>
</svg>
