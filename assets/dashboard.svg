<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292524"/><stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#dbg)"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#fff7ed">📊 Live Dashboard</text>
  <text x="40" y="78" font-size="14" fill="#a8a29e">Today's pulse — revenue, orders, top items, hourly sales</text>

  <!-- stat cards with counting numbers (stacked crossfade) -->
  <g font-size="14">
    <g><rect x="40" y="100" width="210" height="110" rx="14" fill="#292524" stroke="#44403c"/>
      <text x="60" y="130" fill="#a8a29e">💰 Revenue today</text>
      <g font-size="30" font-weight="800" fill="#4ade80">
        <text x="60" y="172">0<animate attributeName="opacity" values="1;0" dur="0.15s" begin="0.6s" fill="freeze"/></text>
        <text x="60" y="172" opacity="0">184,500<animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.6s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="0.15s" begin="1.4s" fill="freeze"/></text>
        <text x="60" y="172" opacity="0">372,000<animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.4s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="0.15s" begin="2.2s" fill="freeze"/></text>
        <text x="60" y="172" opacity="0">486,500 Ks<animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.2s" fill="freeze"/></text>
      </g>
      <text x="60" y="196" fill="#4ade80" font-size="12">▲ 12% vs yesterday</text></g>
    <g><rect x="265" y="100" width="210" height="110" rx="14" fill="#292524" stroke="#44403c"/>
      <text x="285" y="130" fill="#a8a29e">🧾 Orders</text>
      <g font-size="30" font-weight="800" fill="#fff7ed">
        <text x="285" y="172">0<animate attributeName="opacity" values="1;0" dur="0.15s" begin="0.7s" fill="freeze"/></text>
        <text x="285" y="172" opacity="0">48<animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.7s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="0.15s" begin="1.5s" fill="freeze"/></text>
        <text x="285" y="172" opacity="0">96<animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.5s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="0.15s" begin="2.3s" fill="freeze"/></text>
        <text x="285" y="172" opacity="0">132<animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.3s" fill="freeze"/></text>
      </g>
      <text x="285" y="196" fill="#4ade80" font-size="12">▲ 8% vs yesterday</text></g>
    <g><rect x="490" y="100" width="210" height="110" rx="14" fill="#292524" stroke="#44403c"/>
      <text x="510" y="130" fill="#a8a29e">👥 Customers</text>
      <g font-size="30" font-weight="800" fill="#fff7ed">
        <text x="510" y="172">0<animate attributeName="opacity" values="1;0" dur="0.15s" begin="0.8s" fill="freeze"/></text>
        <text x="510" y="172" opacity="0">61<animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.8s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="0.15s" begin="1.6s" fill="freeze"/></text>
        <text x="510" y="172" opacity="0">128<animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.6s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="0.15s" begin="2.4s" fill="freeze"/></text>
        <text x="510" y="172" opacity="0">189<animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.4s" fill="freeze"/></text>
      </g>
      <text x="510" y="196" fill="#f87171" font-size="12">▼ 3% vs yesterday</text></g>
    <g><rect x="715" y="100" width="205" height="110" rx="14" fill="#292524" stroke="#44403c"/>
      <text x="735" y="130" fill="#a8a29e">⏱ Avg prep time</text>
      <g font-size="30" font-weight="800" fill="#fff7ed">
        <text x="735" y="172">--:--<animate attributeName="opacity" values="1;0" dur="0.15s" begin="0.9s" fill="freeze"/></text>
        <text x="735" y="172" opacity="0">14:20<animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.9s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="0.15s" begin="1.7s" fill="freeze"/></text>
        <text x="735" y="172" opacity="0">9:45<animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.7s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="0.15s" begin="2.5s" fill="freeze"/></text>
        <text x="735" y="172" opacity="0">7:32<animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.5s" fill="freeze"/></text>
      </g>
      <text x="735" y="196" fill="#4ade80" font-size="12">▼ faster than avg</text></g>
  </g>

  <!-- bar chart: hourly sales, bars grow in sequence -->
  <g>
    <text x="40" y="252" font-size="17" font-weight="700" fill="#fff7ed">Hourly sales</text>
    <g>
      <rect x="40" y="420" width="34" height="0" rx="6" fill="url(#bar)"><animate attributeName="height" values="0;40" dur="0.5s" begin="0.6s" fill="freeze"/><animate attributeName="y" values="420;380" dur="0.5s" begin="0.6s" fill="freeze"/></rect>
      <rect x="86" y="420" width="34" height="0" rx="6" fill="url(#bar)"><animate attributeName="height" values="0;70" dur="0.5s" begin="0.8s" fill="freeze"/><animate attributeName="y" values="420;350" dur="0.5s" begin="0.8s" fill="freeze"/></rect>
      <rect x="132" y="420" width="34" height="0" rx="6" fill="url(#bar)"><animate attributeName="height" values="0;55" dur="0.5s" begin="1.0s" fill="freeze"/><animate attributeName="y" values="420;365" dur="0.5s" begin="1.0s" fill="freeze"/></rect>
      <rect x="178" y="420" width="34" height="0" rx="6" fill="url(#bar)"><animate attributeName="height" values="0;95" dur="0.5s" begin="1.2s" fill="freeze"/><animate attributeName="y" values="420;325" dur="0.5s" begin="1.2s" fill="freeze"/></rect>
      <rect x="224" y="420" width="34" height="0" rx="6" fill="url(#bar)"><animate attributeName="height" values="0;120" dur="0.5s" begin="1.4s" fill="freeze"/><animate attributeName="y" values="420;300" dur="0.5s" begin="1.4s" fill="freeze"/></rect>
      <rect x="270" y="420" width="34" height="0" rx="6" fill="url(#bar)"><animate attributeName="height" values="0;88" dur="0.5s" begin="1.6s" fill="freeze"/><animate attributeName="y" values="420;332" dur="0.5s" begin="1.6s" fill="freeze"/></rect>
      <rect x="316" y="420" width="34" height="0" rx="6" fill="url(#bar)"><animate attributeName="height" values="0;140" dur="0.5s" begin="1.8s" fill="freeze"/><animate attributeName="y" values="420;280" dur="0.5s" begin="1.8s" fill="freeze"/></rect>
      <rect x="362" y="420" width="34" height="40" rx="6" fill="#4ade80"><animate attributeName="height" values="40;110;40" dur="2.4s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="380;310;380" dur="2.4s" begin="2.2s" repeatCount="indefinite"/></rect>
      <line x1="30" y1="420" x2="420" y2="420" stroke="#44403c" stroke-width="2"/>
      <text x="40" y="442" font-size="11" fill="#78716c">8a  9a  10a  11a  12p  1p  2p  now</text>
    </g>
  </g>

  <!-- line chart: week revenue, draws itself -->
  <g>
    <text x="470" y="252" font-size="17" font-weight="700" fill="#fff7ed">Revenue — last 7 days</text>
    <path d="M470 400 L540 370 L610 385 L680 340 L750 355 L820 310 L890 295" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-dasharray="460" stroke-dashoffset="460">
      <animate attributeName="stroke-dashoffset" values="460;0" dur="2.6s" begin="1s" fill="freeze"/>
    </path>
    <g fill="#4ade80">
      <circle cx="470" cy="400" r="5" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></circle>
      <circle cx="680" cy="340" r="5" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.9s" fill="freeze"/></circle>
      <circle cx="890" cy="295" r="7" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze"/>
        <animate attributeName="r" values="7;10;7" dur="1.6s" begin="3.6s" repeatCount="indefinite"/></circle>
    </g>
    <text x="470" y="442" font-size="11" fill="#78716c">Mon — Sun • all values in Ks</text>
  </g>

  <!-- top items ticker -->
  <g font-size="13">
    <text x="40" y="482" font-size="17" font-weight="700" fill="#fff7ed">🏆 Top items today</text>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.6s" fill="freeze"/>
      <rect x="40" y="494" width="270" height="30" rx="15" fill="#292524"/><text x="56" y="514" fill="#e7e5e4">1. Milk Tea — 48 sold</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3s" fill="freeze"/>
      <rect x="322" y="494" width="270" height="30" rx="15" fill="#292524"/><text x="338" y="514" fill="#e7e5e4">2. Latte — 41 sold</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>
      <rect x="604" y="494" width="270" height="30" rx="15" fill="#292524"/><text x="620" y="514" fill="#e7e5e4">3. Shan Noodle — 33 sold</text></g>
  </g>
</svg>
